version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - auth-service
      - wishlist-service
      - matching-service
      - seller-service
      - cluster-service
      - match-engine-service
      - validation-service
      - notification-service
      - admin-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${DB_NAME:-wishi}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-wishi}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/auth/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

  wishlist-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/wishlist/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  matching-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/matching/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  seller-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/seller/Dockerfile

  cluster-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/cluster/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  match-engine-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/match-engine/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  validation-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/validation/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  notification-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/notification/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  admin-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/admin/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres

  worker-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/worker/Dockerfile
    environment:
      - DB_NAME=${DB_NAME:-wishi}
      - DB_USER=${DB_USER:-user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_HOST=postgres
    command: ["celery", "-A", "app.tasks", "worker", "--beat", "--loglevel=info"]

  prometheus:
    image: prom/prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  postgres_data:

networks:
  default:
    name: deal-platform-network
