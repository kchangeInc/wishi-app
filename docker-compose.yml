version: '3.9'

x-backend-logging-env: &backend-logging-env
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  ENABLE_STDOUT_LOGS: "true"
  ENABLE_FILE_LOGS: "false"
  ENABLE_COMMON_TRACELOG: "false"

x-structured-logging-labels: &structured-logging-labels
  wishi_logging: structured
  wishi_log_format: json

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend-fastapi
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      <<: *backend-logging-env
    labels:
      <<: *structured-logging-labels
    depends_on:
      - auth-service
      - wishlist-service
      - matching-service
      - seller-service
      - cluster-service
      - match-engine-service
      - validation-service
      - notification-service
      - admin-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 30s
      timeout: 10s
      retries: 3

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${DB_NAME:-wishi}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-wishi}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-prod}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  wishlist-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/wishlist/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  matching-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/matching/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  seller-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/seller/Dockerfile
    environment:
      <<: *backend-logging-env
    labels:
      <<: *structured-logging-labels

  cluster-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/cluster/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  match-engine-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/match-engine/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  validation-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/validation/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  admin-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/admin/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    depends_on:
      postgres:
        condition: service_healthy

  worker-service:
    build:
      context: ./backend-fastapi
      dockerfile: services/worker/Dockerfile
    environment:
      <<: *backend-logging-env
      DB_NAME: ${DB_NAME:-wishi}
      DB_USER: ${DB_USER:-user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOST: postgres
    labels:
      <<: *structured-logging-labels
    command: ["celery", "-A", "app.tasks", "worker", "--beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  loki:
    image: grafana/loki:2.9.8
    ports:
      - '3100:3100'
    command: ["-config.file=/etc/loki/local-config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

  grafana:
    image: grafana/grafana
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  loki_data:
  postgres_data:
  promtail_positions:

networks:
  default:
    name: deal-platform-network
